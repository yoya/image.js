<!doctype html>
<html>
  <head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="copyright" content="Copyright &copy; 2019/04/12- yoya@awm.jp . All Rights Reserved.">
    <meta charset="utf-8">
    <title> Exponential </title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="soft.css">
    <script src="lib/page.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="controlPanel">
        <div>
	  <label class="param"><span class="name">a</span><input id="aRange" data-bind="a" type="range" min="1" max="5" step="0.000000000001" value="2.718281828459"  style="width:256px;"><input type="text" id="aText" data-bind="a" size="5" value="2.718281828459" style="width:128px;"></label>
        </div>
        <div>
          <label class="check"><input id="expCheckbox" data-bind="exp" type="checkbox" checked> exp(a,x)</label> <br />
          <label class="check"><input id="expdiffCheckbox" data-bind="expdiff" type="checkbox" checked> (exp(a,x+h)-exp(a,x)/h</label> <br />
          <label class="check"><input id="explogCheckbox" data-bind="explog" type="checkbox"> exp(a,x)*log(a)</label>
      </div>
      </div> <!-- controlPanel -->
      <canvas id="graphCanvas" class="borderGreen" width=512 height=512> srcCanvas </canvas>
    </div>  <!-- container -->
    <script type="text/javascript" src="lib/bind.js"> </script>
    <script type="text/javascript" src="lib/canvas.js"> </script>
    <script type="text/javascript" src="lib/graph.js"> </script>
    <script type="text/javascript" src="exponential.js"> </script>
  </body>
</html>
