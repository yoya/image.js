<html>
  <head>
    <meta name="copyright" content="Copyright &copy; 2019/06/07- yoya@awm.jp . All Rights Reserved.">
    <meta charset="utf-8">
    <title> Contrast Asynchrony </title>
    <link rel="stylesheet" href="index.css">
    <script src="lib/page.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="controlPanel">
        <div style="float:left">
	  width:<input id="widthRange" data-bind="width" type="range" min="16" max="1280" step="1" value="600">
          :<input type="text" id="widthText" data-bind="width" size="5">
          <br />
          height:<input id="heightRange" data-bind="height" type="range" min="16" max="1080" step="1" value="400">
          :<input type="text" id="heightText" data-bind="height" size="5">
          </div>
        <div>
          period:<input id="periodRange" data-bind="period" type="range" min="0.5" max="8" step="0.5" value="2">
          :<input type="text" id="periodText" data-bind="period" size="5">
          <br />
          debug 1:<input type="checkbox" id="debug1Checkbox" data-bind="debug1" /> 2:<input type="checkbox" id="debug2Checkbox" data-bind="debug2" /> 3:<input type="checkbox" id="debug3Checkbox" data-bind="debug3" />
        </div>
      </div> <!-- controlPanel -->
      <div style="clear:both">
      <canvas id="canvas" width=200 height=200> srcCanvas </canvas>
      <video id="video" width=200 height=200 src="" muted autoplay style="display:none"> </video>
    </div>  <!-- container -->
    <script type="text/javascript" src="lib/bind.js"> </script>
    <script type="text/javascript" src="lib/canvas.js"> </script>
    <script type="text/javascript" src="lib/testcard.js"> </script>
    <script type="text/javascript" src="contrastasynchrony.js"> </script>
  </body>
</html>
