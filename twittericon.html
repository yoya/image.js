<!doctype html>
<html>
  <head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="copyright" content="Copyright &copy; 2017/06/16- yoya@awm.jp . All Rights Reserved.">
    <meta charset="utf-8">
    <title> Twitter Icon </title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="soft.css">
    <script src="lib/page.js"></script>
  </head>
  <body>
    四角い画像を Twitter アイコンで丸められる範囲に縮小して納まるようにします。
    <div class="container">
      <div class="controlPanel">
	<div>
	  <label class="param"><span class="name">maxWidthHeight</span><input id="maxWidthHeightRange" data-bind="maxWidthHeight" type="range" min="16" max="2048" step="1" value="640"><input type="text" id="maxWidthHeightText" data-bind="maxWidthHeight" size="5"></label>
	  <label class="check"><input id="guideCheckbox" data-bind="guide" type="checkbox" /> guide</label>
	  guideColor:<input id="guideColorText" data-bind="guideColor" class="jscolor" value="BBBBBB" size="9">
	</div>
	<div style="float:left">
	  <input id="bilinearButton" data-bind="bilinearButton" type="button" value="BiLinear" />
	</div>
	<div style="float:left">
          Out-side:  <br />
	  <select id="outfillSelect" data-bind="outfill" size="5">
            <option value="white" selected> 白埋め </option>
            <option value="black"         > 黒埋め </option>
            <option value="edge"          > エッジ拡張 </option>
            <option value="tile"          > タイル補完 </option>
            <option value="mirror"        > ミラー補完 </option>
          </select>
	</div>
	<div style="float:left">
	  Projection: <br />
	  <select id="projSelect" data-bind="proj" size="3">
            <option value="normal" selected> Normal </option>
            <option value="fisheye"        > FishEye </option>
            <option value="doom"           > Doom </option>
          </select>
	  <br />
	</div>
	<div style="float:left">
	  Offset, Radius:
	  <br />
	  <label class="param"><span class="name">srcProjX</span><input id="srcProjXRange" data-bind="srcProjX" type="range" min="0.0" max="1.0" step="0.01" value="0.5"><input type="text" id="srcProjXText" data-bind="srcProjX" size="4"></label>
	  <label class="param"><span class="name">srcProjY</span><input id="srcProjYRange" data-bind="srcProjY" type="range" min="0.0" max="1.0" step="0.01" value="0.5"><input type="text" id="srcProjYText" data-bind="srcProjY" size="4"></label>
	  <label class="param"><span class="name">srcProjR</span><input id="srcProjRRange" data-bind="srcProjR" type="range" min="0.0" max="2.0" step="0.01" value="1.0"><input type="text" id="srcProjRText" data-bind="srcProjR" size="4"></label>
	</div>
	<div style="float:left">
	  OverlapImage: <br />
	  <select id="overlapSelect" data-bind="overlap" size="12">
            <option value="none" selected> none </option>
            <option value="badge"        > Badge </option>
	    <option value="scope"        > Scope </option>
	    <option value="clockBlue"    > Clock(Blue) </option>
	    <option value="clockYellow"  > Clock(Yellow) </option>
	    <option value="clockRed"     > Clock(Red) </option>
	    <option value="bubbleSoap"   > Bubble (Violet) </option>
	    <option value="bubbleCyan"   > Bubble (Cyan) </option>
	    <option value="bubbleBlue"   > Bubble (Blue) </option>
	    <option value="bubbleMagenta"> Bubble (Magenta) </option>
	    <option value="bubbleGreen"  > Bubble (Green) </option>
	    <option value="bubbleRainbow"> Bubble (Rainbow) </option>
          </select>
	</div>
	<div style="clear:both">
	<small>
	  <span id="imageCopyright"> </span>
	</small>
	</div>
      </div> <!-- controlPanel -->
      <div style="clear:both">
	<canvas id="srcCanvas" class="borderRed" width=200 height=200> srcCanvas </canvas>
	<canvas id="dstCanvas" class="borderBlue" width=200 height=200> dstCanvas </canvas>
      </div>
    </div>  <!-- container -->
    <script type="text/javascript" src="dist/jscolor/jscolor.js"> </script>
    <script type="text/javascript" src="lib/drop.js"> </script>
    <script type="text/javascript" src="lib/bind.js"> </script>
    <script type="text/javascript" src="lib/canvas.js"> </script>
    <script type="text/javascript" src="lib/canvas_interpolation.js"> </script>
    <script type="text/javascript" src="twittericon.js"> </script>
  </body>
</html>
