<html>
  <head>
    <meta name="copyright" content="Copyright &copy; 2022/01/29- yoya@awm.jp . All Rights Reserved.">
    <meta charset="utf-8">
    <title> Grid Chrome </title>
    <link rel="stylesheet" href="index.css">
    <script src="lib/page.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="controlPanel" style="display:flex">
        <div>
	  maxWidthHeight:<input id="maxWidthHeightRange" data-bind="maxWidthHeight" type="range" min="16" max="2048" step="1" value="640">:<input type="text" id="maxWidthHeightText" data-bind="maxWidthHeight" size="5">
          <br />
          cheat:<input id="cheatRange" data-bind="cheat" type="range" min="0" max="20" step="1" value="4">:<input type="text" id="cheatText" data-bind="cheat" size="3">
        </div>
        <div>
          period:<input id="periodRange" data-bind="period" type="range" min="1" max="48" step="1" value="32">:<input type="text" id="periodText" data-bind="period" size="3">
          <br />
          width:<input id="widthRange" data-bind="width" type="range" min="1" max="32" step="1" value="2">:<input type="text" id="widthText" data-bind="width" size="3">
        </div>
      </div> <!-- controlPanel -->
      <canvas id="srcCanvas" class="borderRed" width=200 height=200> srcCanvas </canvas>
      <canvas id="dstCanvas" class="borderBlue" width=200 height=200> dstCanvas </canvas>
    </div>  <!-- container -->
    <script type="text/javascript" src="lib/drop.js"> </script>
    <script type="text/javascript" src="lib/bind.js"> </script>
    <script type="text/javascript" src="lib/canvas.js"> </script>
    <script type="text/javascript" src="gridchrome.js"> </script>
  </body>
</html>
