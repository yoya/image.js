<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="copyright" content="Copyright &copy; 2017/04/02- yoya@awm.jp . All Rights Reserved.">
  <meta charset="utf-8">
  <title> Sepia tone </title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="soft.css">
  <script src="lib/page.js"></script>
</head>
<body>
  <div class="container">
    <div id="controlPanel"  style="float:left">
      <div style="float:left">
	<label class="param"><span class="name">maxWidthHeight</span><input id="maxWidthHeightRange" data-bind="maxWidthHeight" type="range" min="16" max="2048" step="1" value="480"><input type="text" id="maxWidthHeightText" data-bind="maxWidthHeight" size="5"></label>
	<label class="check"><input id="linearCheckbox" data-bind="linear" type="checkbox" /> linear</label>
	<br />
	<label class="param"><span class="name">amount</span><input id="amountRange" data-bind="amount" type="range" min="0.0" max="1.0" step="0.01" value="1.0"><input type="text" id="amountText" data-bind="amount" size="5"></label>
      </div>
    </div>
    <div style="clear:both">
      <canvas id="srcCanvas" class="borderRed" width=200 height=200> srcCanvas </canvas>
      <canvas id="dstCanvas" class="borderBlue" width=200 height=200> dstCanvas </canvas>
    </div>
    <copyright> (c) https://twitter.com/soramimi_jp/status/1061053416061906946 </copyright>
  </div>
  <script type="text/javascript" src="lib/drop.js"> </script>
  <script type="text/javascript" src="lib/bind.js"> </script>
  <script type="text/javascript" src="lib/canvas.js"> </script>
  <script type="text/javascript" src="lib/color.js"> </script>
  <script type="text/javascript" src="sepia_soramimi.js"> </script>
</body>
</html>
