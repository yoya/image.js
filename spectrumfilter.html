<!doctype html>
<html>
  <head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="copyright" content="Copyright &copy; 2024/04/21- yoya@awm.jp . All Rights Reserved.">
    <meta charset="utf-8">
    <title> Spectrum Filter </title>
    <link rel="stylesheet" href="index.css">
    <script src="lib/page.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="controlPanel">
	<label class="param"><span class="name">maxWidthHeight</span><input id="maxWidthHeight" data-bind="maxWidthHeight" type="range" min="16" max="2048" step="1" value="640"><input type="text" id="maxWidthHeightText" data-bind="maxWidthHeight" size="5"></label>
        <label class="param"><span class="name">contrast</span><input id="contrast" data-bind="contrast" type="range" min="0" max="3.0" step="0.1" value="1.6"><input type="text" id="contrastText" data-bind="contrast" size="4"></label>
      </div> <!-- controlPanel -->
      <canvas id="srcCanvas" class="borderRed" width=200 height=200> srcCanvas </canvas>
      <canvas id="spectrumCanvas" class="borderGreen" width=200 height=200> spectrumCanvas </canvas>
      
      <canvas id="dstCanvas" class="borderBlue" width=200 height=200> dstCanvas </canvas>
    </div>  <!-- container -->
    <script type="text/javascript" src="lib/drop.js"> </script>
    <script type="text/javascript" src="lib/bind.js"> </script>
    <script type="text/javascript" src="lib/canvas.js"> </script>
    <script type="text/javascript" src="lib/math.js"> </script>
    <script type="text/javascript" src="lib/kernel.js"> </script>
    <script type="text/javascript" src="lib/convolve.js"> </script>
    <script type="text/javascript" src="spectrumfilter.js"> </script>
  </body>
</html>
