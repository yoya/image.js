<!doctype html>
<html>
  <head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="copyright" content="Copyright &copy; 2022/02/13- yoya@awm.jp . All Rights Reserved.">
    <meta charset="utf-8">
    <title> Color Transfer </title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="soft.css">
    <script src="lib/page.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="controlPanel" style="display:flex">
        <div>
	  <label class="param"><span class="name">maxWidthHeight</span><input id="maxWidthHeightRange" data-bind="maxWidthHeight" type="range" min="16" max="2048" step="1" value="640"><input type="text" id="maxWidthHeightText" data-bind="maxWidthHeight" size="5"></label>
          <label class="param"><span class="name">fuzz</span><input id="fuzzRange" data-bind="fuzz" type="range" min="0.0" max="1.0" step="0.01" value="0.2"><input type="text" id="fuzzText" data-bind="fuzz" size="5"></label>
        </div>
        <div>
          srcColor <br />
          <input type="checkbox" id="colorSrcDstRadio1" data-bind="colorSrcDstRadio1" checked>
        </div>:
        <input id="srcColorText" data-bind="srcColor" class="jscolor" value="000000" size="9"> <br/>
        <div>
          dstColor <br />
          <input type="checkbox" id="colorSrcDstRadio2" data-bind="colorSrcDstRadio2">
        </div>:
        <input id="dstColorText" data-bind="dstColor" class="jscolor" value="000000" size="9"> <br/>
        <div>
          <label class="param"><span class="name">diffSync</span><input id="diffSyncRange" data-bind="diffSync" type="range" min="0.0" max="1.0" step="0.01" value="1.0"><input type="text" id="diffSyncText" data-bind="diffSync" size="5"></label>
          <label class="param"><span class="name">diffRelative</span><input id="diffRelativeRange" data-bind="diffRelative" type="range" min="-1.0" max="1.0" step="0.1" value="0.0"><input type="text" id="diffRelativeText" data-bind="diffRelative" size="4"></label>
        </div>
      </div> <!-- controlPanel -->
      <canvas id="srcCanvas" class="borderRed" width=200 height=200> srcCanvas </canvas>
      <canvas id="dstCanvas" class="borderBlue" width=200 height=200> dstCanvas </canvas>
    </div>  <!-- container -->
    <script type="text/javascript" src="dist/jscolor/jscolor.js"> </script>
    <script type="text/javascript" src="lib/utils.js"> </script>
    <script type="text/javascript" src="lib/drop.js"> </script>
    <script type="text/javascript" src="lib/bind.js"> </script>
    <script type="text/javascript" src="lib/canvas.js"> </script>
    <script type="text/javascript" src="colortransfer.js"> </script>
  </body>
</html>
