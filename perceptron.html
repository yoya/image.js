<!doctype html>
<html>
  <head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="copyright" content="Copyright &copy; 2019/04/08- yoya@awm.jp . All Rights Reserved.">
    <meta charset="utf-8">
    <title> Perceptron </title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="soft.css">
    <script src="lib/page.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="controlPanel">
        <div>
	  <label class="param"><span class="name">w1</span><input id="w1Range" data-bind="w1" type="range" min="-1" max="1" step="0.1" value="0.5"><input type="text" id="w1Text" data-bind="w1" size="5"></label>
          <label class="param"><span class="name">w2</span><input id="w2Range" data-bind="w2" type="range" min="-1" max="1" step="0.1" value="0.5"><input type="text" id="w2Text" data-bind="w2" size="5"></label>
        </div>
        <label class="param"><span class="name">theta</span><input id="thetaRange" data-bind="theta" type="range" min="-1" max="1" step="0.1" value="0.5"><input type="text" id="thetaText" data-bind="theta" size="5"></label>
        </div>
      </div> <!-- controlPanel -->
      <canvas id="graphCanvas" class="borderGreen" width=512 height=512> srcCanvas </canvas>
    </div>  <!-- container -->
    <script type="text/javascript" src="lib/bind.js"> </script>
    <script type="text/javascript" src="lib/canvas.js"> </script>
    <script type="text/javascript" src="lib/graph.js"> </script>
    <script type="text/javascript" src="perceptron.js"> </script>
  </body>
</html>
