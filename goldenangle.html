<!doctype html>
<html>
  <head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="copyright" content="Copyright &copy; 2018/12/14- yoya@awm.jp . All Rights Reserved.">
    <meta charset="utf-8">
    <title> Golden Angle </title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="soft.css">
    <script src="lib/page.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="controlPanel">
	<label class="param"><span class="name">maxWidthHeight</span><input id="maxWidthHeightRange" data-bind="maxWidthHeight" type="range" min="16" max="2048" step="1" value="256"><input type="text" id="maxWidthHeightText" data-bind="maxWidthHeight" size="5"></label>
	<label class="param"><span class="name">unitWidth</span><input id="unitWidthRange" data-bind="unitWidth" type="range" min="1" max="1024" step="1" value="64"><input type="text" id="unitWidthText" data-bind="unitWidth" size="5"></label>
	<label class="param"><span class="name">unitHeight</span><input id="unitHeightRange" data-bind="unitHeight" type="range" min="1" max="1024" step="1" value="2048"><input type="text" id="unitHeightText" data-bind="unitHeight" size="5"></label>
      </div> <!-- controlPanel -->
      <canvas id="hueCanvas" class="borderRed" width=256 height=256> hueCanvas </canvas>
      <br />
      <canvas id="colorCanvas" class="borderGreen" width=256 height=256> colorCanvas </canvas>
    </div>  <!-- container -->
    <script type="text/javascript" src="lib/drop.js"> </script>
    <script type="text/javascript" src="lib/bind.js"> </script>
    <script type="text/javascript" src="lib/canvas.js"> </script>
    <script type="text/javascript" src="lib/color.js"> </script>
    <script type="text/javascript" src="goldenangle.js"> </script>
  </body>
</html>
