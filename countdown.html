<!doctype html>
<html>
  <head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="copyright" content="Copyright &copy; 2018/01/21- yoya@awm.jp . All Rights Reserved.">
    <meta charset="utf-8">
    <title> Count Down </title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="soft.css">
    <script src="lib/page.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="controlPanel">
	<div>
          <select id="typeSelect" data-bind="type" size="3"  style="float:left">
            <option value="testcard" selected> テストカード </option>
            <option value="oldmovie" selected> 古いムービー風 </option>
          </select>
        </div>
        <input id="playButton" data-bind="playButton" type="button" value="Play"/>
        <input id="stopButton" data-bind="stopButton" type="button" value="Stop"/>
        <input id="downloadButton" data-bind="downloadButton" type="button" value="Download"/>
	<label class="param"><span class="name">width</span><input id="widthRange" data-bind="width" type="range" min="16" max="1920" step="1" value="960"></label>
        :<input type="text" id="widthText" data-bind="width" size="5">
        <label class="param"><span class="name">height</span><input id="heightRange" data-bind="height" type="range" min="16" max="1080" step="1" value="540"></label>
        :<input type="text" id="heightText" data-bind="height" size="5">
      </div> <!-- controlPanel -->
      <div style="clear:both">
      <canvas id="canvas" width=200 height=200> srcCanvas </canvas>
      <video id="video" width=200 height=200 muted autoplay style="display:none"> </video>
    </div>  <!-- container -->
    <script type="text/javascript" src="lib/bind.js"> </script>
    <script type="text/javascript" src="lib/canvas.js"> </script>
    <script type="text/javascript" src="lib/testcard.js"> </script>
    <script type="text/javascript" src="countdown.js"> </script>
  </body>
</html>
