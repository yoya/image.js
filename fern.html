<!doctype html>
<html>
  <head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="copyright" content="Copyright &copy; 2021/02/22- yoya@awm.jp . All Rights Reserved.">
    <meta charset="utf-8">
    <title> Fern </title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="soft.css">
    <script src="lib/page.js"></script>
    <style>
      canvas { background-color:black; }
      </style>
  </head>
  <body>
    <div class="container">
      <div class="controlPanel" style="display:flex">
      <div>
	<label class="param"><span class="name">Width</span><input id="width" data-bind="width" type="range" min="64" max="2048" step="1" value="420"><input type="text" id="widthText" data-bind="width" size="5"></label>
        <label class="param"><span class="name">Height</span><input id="height" data-bind="height" type="range" min="64" max="2048" step="1" value="640"><input type="text" id="heightText" data-bind="height" size="5"></label>
      </div>
      <div>
        <label class="param"><span class="name">Count</span><input id="count" data-bind="count" type="range" min="1" max="100000" step="1" value="1000"><input type="text" id="countText" data-bind="count" size="7"></label>
        <label class="check"><input id="animation" data-bind="animation" type="checkbox" /> Animation</label>
      </div>
      </div> <!-- controlPanel -->
      <canvas id="canvas" class="borderRed" width=320 height=320> canvas </canvas>
    </div>  <!-- container -->
    <small> (c) <a href="https://twitter.com/awotere7/status/1363471771836567559"> https://twitter.com/awotere7/status/1363471771836567559 </a> </small>
    <script type="text/javascript" src="lib/bind.js"> </script>
    <script type="text/javascript" src="lib/canvas.js"> </script>
    <script type="text/javascript" src="fern.js"> </script>
  </body>
</html>
