<!doctype html>
<html>
  <head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="copyright" content="Copyright &copy; 2017/06/23- yoya@awm.jp . All Rights Reserved.">
    <meta charset="utf-8">
    <title> Gravity </title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="soft.css">
    <script src="lib/page.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="controlPanel">
	<div style="float:left">
	  <label class="param"><span class="name">maxWidthHeight</span><input id="maxWidthHeightRange" data-bind="maxWidthHeight" type="range" min="16" max="2048" step="1" value="640"><input type="text" id="maxWidthHeightText" data-bind="maxWidthHeight" size="5"></label>
	  <label class="param"><span class="name">dstWidth</span><input id="dstWidthRange" data-bind="dstWidth" type="range" min="1" max="2048" step="1" value="200"><input type="text" id="dstWidthText" data-bind="dstWidth" size="5"></label>
	  <label class="param"><span class="name">dstHeight</span><input id="dstHeightRange" data-bind="dstHeight" type="range" min="1" max="2048" step="1" value="200"><input type="text" id="dstHeightText" data-bind="dstHeight" size="5"></label>
	</div>
	<div style="float:left">
	  gravity:<table id="gravityTable"> </table>
	</div>
	<div>
          Out-side fill style:  <br />
          <select id="outfillSelect" data-bind="outfill" size="5">
            <option value="black" selected> 黒埋め </option>
            <option value="transparent"   > 透明  </option>
            <option value="edge"          > エッジ拡張 </option>
            <option value="tile"          > タイル補完 </option>
            <option value="mirror"        > ミラー補完 </option>
            <option value="white"         > 白埋め </option>
          </select>
	</div>
      </div> <!-- controlPanel -->
      <div style="clear:both">
	<canvas id="srcCanvas" class="borderRed" width=200 height=200> srcCanvas </canvas>
	<canvas id="dstCanvas" class="borderBlue" width=200 height=200> dstCanvas </canvas>
      </div>
    </div>  <!-- container -->
    <script type="text/javascript" src="lib/drop.js"> </script>
    <script type="text/javascript" src="lib/bind.js"> </script>
    <script type="text/javascript" src="lib/canvas.js"> </script>
    <script type="text/javascript" src="lib/loading.js"> </script>
    <script type="text/javascript" src="lib/worker.js"> </script>
    <script type="text/javascript" src="gravity.js"> </script>
  </body>
</html>
