<html>
  <head>
    <meta name="copyright" content="Copyright &copy; 2017/06/21- yoya@awm.jp . All Rights Reserved.">
    <meta charset="utf-8">
    <title> Vignette </title>
    <link rel="stylesheet" href="index.css">
  </head>
  <body>
    <div class="container">
      <div class="controlPanel">
	maxWidthHeight:<input id="maxWidthHeightRange" data-bind="maxWidthHeight" type="range" min="16" max="2048" step="1" value="640">:<input type="text" id="maxWidthHeightText" data-bind="maxWidthHeight" size="5">
	radius:<input id="radiusRange" data-bind="radius" type="range" min="0.5" max="2.0" step="0.1" value="1.0">:<input type="text" id="radiusText" data-bind="radius" size="4">
        bias:<input id="biasRange" data-bind="bias" type="range" min="-1.0" max="1.0" step="0.05" value="0.0">:<input type="text" id="biasText" data-bind="bias" size="4">
	linearGamma:<input id="linearGammaCheckbox" data-bind="linearGamma" type="checkbox" checked/>
	inverse:<input id="inverseCheckbox" data-bind="inverse" type="checkbox" />
      </div> <!-- controlPanel -->
      <canvas id="srcCanvas" class="borderRed" width=200 height=200> srcCanvas </canvas>
      <canvas id="dstCanvas" class="borderBlue" width=200 height=200> dstCanvas </canvas>
    </div>  <!-- container -->
    <script type="text/javascript" src="lib/drop.js"> </script>
    <script type="text/javascript" src="lib/bind.js"> </script>
    <script type="text/javascript" src="lib/canvas.js"> </script>
    <script type="text/javascript" src="lib/loading.js"> </script>
    <script type="text/javascript" src="lib/worker.js"> </script>
    <script type="text/javascript" src="vignette.js"> </script>
  </body>
</html>
