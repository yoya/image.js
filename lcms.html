<html>
  <head>
    <meta name="copyright" content="Copyright &copy; 2017/04/02- yoya@awm.jp . All Rights Reserved.">
    <meta charset="utf-8">
    <title> Little-CMS </title>
    <link rel="stylesheet" href="index.css">
    <style>
      .colorSpaceSelector { width: 256px; }
      .colorSlider { width: 256px; }
      canvas { background-color:black; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="controlPanel">
	
      </div> <!-- controlPanel -->
      <div style="float:left;">
        <select id="srcSelect" data-bind="src" class="colorSpaceSelector">
	  <option value="rgb/sRGB_LittleCMS1.icc" selected> sRGB (LittleCMS v1)) </option>
	  <option value="rgb/DisplayP3.icc" disabled="disabled"> Display P3 (Apple) </option>
	  <option value="rgb/AdobeRGB1998.icc" disabled="disabled"> Adobe RGB 1998 (Adobe)</option>
	  <option value="rgb/ISO22028-2_ROMM-RGB.icc" disabled="disabled"> ProPhoto RGB, ROMM RGB </option>
	  <option value="rgb/ITUR_2100_PQ_FULL.ICC" disabled="disabled"> High Dynamic Range UHDTV Wide </option>
	  <option value="cmyk/JapanColor2001Coated.icc" disabled="disabled"> Japan Color 2001 Coated (Adobe) </option>
	  <option value="cmyk/JapanColor2011Coated.icc" disabled="disabled"> Japan Color 2011 Coated </option>
	  <option value="cmyk/USWebCoatedSWOP.icc" disabled="disabled"> U.S. Web Coated (SWOP) v2 </option>
	  <option value="cmyk/WebCoatedFOGRA28.icc" disabled="disabled"> Web Coated FOGRA28 </option>
	  <option value="cmyk/UncoatedFOGRA29.icc" disabled="disabled"> Uncoated FOGRA29 </option>
	</select> <br />
	<textarea id="srcDesc" cols="50"> profile loading ... </textarea> <br />
	<canvas id="srcCanvas" class="borderRed" width=320 height=320> srcCanvas </canvas>
	<canvas id="srcDiagramBaseCanvas" width=320 height=320 style="display: none"> srcDiagramBaseCanvas </canvas>
	<br />
	<div id="srcGray">
	  V:<input type="range" id="srcVRange" data-bind="srcV" class="colorSlider" min="0" max="255" step="0.01" value="0" />
	    <input type="text" id="srcVText" data-bind="srcV" size="6" value="0" />  <br />
	</div>
	<div id="srcRGB">
	  R:<input type="range" id="srcRRange" data-bind="srcR" class="colorSlider" min="0" max="255" step="0.01" value="0" />
	    <input type="text" id="srcRText" data-bind="srcR" size="6" value="0" />  <br />
	  G:<input type="range" id="srcGRange" data-bind="srcG" class="colorSlider" mim="0" max="255" step="0.01" value="0" />
	    <input type="text" id="srcGText" data-bind="srcG" size="6" value="0"  />  <br />
	  B:<input type="range" id="srcBRange" data-bind="srcB" class="colorSlider" mim="0" max="255" step="0.01" value="0" />
	    <input type="text" id="srcBText" data-bind="srcB" size="6" value="0" />
	</div>
	<div id="srcCMYK">
	  C:<input type="range" id="srcCRange" data-bind="srcC" class="colorSlider" mim="0" max="100" step="0.01" value="0" />
	    <input type="text" id="srcCText" data-bind="srcC" size="6" value="0" /> <br />
	  M:<input type="range" id="srcMRange" data-bind="srcM" class="colorSlider" mim="0" max="100" step="0.01" value="0" />
	    <input type="text" id="srcMText" data-bind="srcM" size="6" value="0" /> <br />
	  Y:<input type="range" id="srcYRange" data-bind="srcY" class="colorSlider" mim="0" max="100" step="0.01" value="0" />
	    <input type="text" id="srcYText" data-bind="srcY" size="6" value="0" /> <br />
	  K:<input type="range" id="srcKRange" data-bind="srcK" class="colorSlider" mim="0" max="100" step="0.01" value="0" />
	    <input type="text" id="srcKText" data-bind="srcK" size="6" value="0" />
	</div>
	<div id="srcXYZ">
	  XYZ: <input type="text" id="srcXYZ_XText" size="6" value="" />
          <input type="text" id="srcXYZ_YText" size="6" value="" />
          <input type="text" id="srcXYZ_ZText" size="6" value="" />
	  xy: <input type="text" id="srcxyY_xText" size="6" value="" />
          <input type="text" id="srcxyY_yText" size="6" value="" />
	</div>
      </div>
      <div style="float:left; ">
        <select id="intentSelect" data-bind="intent" size="4">
	  <option value="0" selected> Perceptual </option>
	  <option value="1"         > Relative Colorimetric </option>
	  <option value="2"         > Saturation </option>
	  <option value="3"         > Absolute Colorimetric </option>
	</select>
	<div>
	  BPC:<input id="BPCCheckbox" data-bind="BPC" type="checkbox" checked="checked"/>
	</div>
	<div>
	  <div id="transformForward" align="left">
	    &#8658;  &#8811; &#8811;
	  </div>
	  <div id="transformInverse" align="right">
	    &#8810; &#8810; &#8656;
	  </div>
	</div>
      </div>
      <div style="float:left;">
	<select id="dstSelect" data-bind="dst" class="colorSpaceSelector">
	</select> <br />
	<textarea id="dstDesc" cols="50">  profile loading ... </textarea> <br />
	<canvas id="dstCanvas" class="borderBlue" width=320 height=320> dstCanvas </canvas>
	<canvas id="dstDiagramBaseCanvas" width=320 height=320 style="display: none"> dstDiagramBaseCanvas </canvas>
	<br />
	<div id="dstGray">
	  V:<input type="range" id="dstVRange" data-bind="dstV" class="colorSlider" mim="0" max="255" step="0.01" value="0" />
	    <input type="text" id="dstVText" data-bind="dstV" size="6" value="0" /> <br />
	</div>
	<div id="dstRGB">
	  R:<input type="range" id="dstRRange" data-bind="dstR" class="colorSlider" mim="0" max="255" step="0.01" value="0" class="colorSlider" />
	    <input type="text" id="dstRText" data-bind="dstR" size="6" value="0" /> <br />
	  G:<input type="range" id="dstGRange" data-bind="dstG" class="colorSlider" mim="0" max="255" step="0.01" value="0" />
	    <input type="text" id="dstGText" data-bind="dstG" size="6" value="0" />  <br />
	  B:<input type="range" id="dstBRange" data-bind="dstB" class="colorSlider" mim="0" max="255" step="0.01" value="0" />
	    <input type="text" id="dstBText" data-bind="dstB" size="6" value="0" />  <br />
	</div>
	<div id="dstCMYK">
	  C:<input type="range" id="dstCRange" data-bind="dstC" class="colorSlider" mim="0" max="100" step="0.01" value="0" />
	    <input type="text" id="dstCText" data-bind="dstC" size="6" value="0" /> <br />
	  M:<input type="range" id="dstMRange" data-bind="dstM" class="colorSlider" mim="0" max="100" step="0.01" value="0" />
	    <input type="text" id="dstMText" data-bind="dstM" size="6" value="0" /> <br />
	  Y:<input type="range" id="dstYRange" data-bind="dstY" class="colorSlider" mim="0" max="100" step="0.01" value="0" />
	    <input type="text" id="dstYText" data-bind="dstY" size="6" value="0" /> <br />
	  K:<input type="range" id="dstKRange" data-bind="dstK" class="colorSlider" mim="0" max="100" step="0.01" value="0" />
	    <input type="text" id="dstKText" data-bind="dstK" size="6" value="0" /> <br />
	</div>
	<div id="dstXYZ">
	  XYZ: <input type="text" id="dstXYZ_XText" size="6" value="" />
          <input type="text" id="dstXYZ_YText" size="6" value="" />
          <input type="text" id="dstXYZ_ZText" size="6" value="" />
	  xy: <input type="text" id="dstxyY_xText" size="6" value="" />
          <input type="text" id="dstxyY_yText" size="6" value="" />
	</div>
      </div>
    </div>  <!-- container -->
    
    <script type="text/javascript" src="lib/utils.js"> </script>
    <script type="text/javascript" src="lib/drop.js"> </script>
    <script type="text/javascript" src="lib/bind.js"> </script>
    <script type="text/javascript" src="lib/canvas.js"> </script>
    <script type="text/javascript" src="lib/binary.js"> </script>
    <script type="text/javascript" src="lib/color.js"> </script>
    <script type="text/javascript" src="lib/cie.js"> </script>
    <script type="text/javascript" src="lib/jpeg.js"> </script>
    <script type="text/javascript" src="lib/png.js"> </script>
    <script type="text/javascript" src="dist/yoya/lcms.js/bin/lcms-O1.js"> </script>
    <script type="text/javascript" src="dist/yoya/lcms.js/lcms-wrapper.js"> </script>
    <script type="text/javascript" src="lcms.js"> </script>
  </body>
</html>
