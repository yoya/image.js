<html>
<head>
  <meta name="copyright" content="Copyright &copy; 2017/04/17- yoya@awm.jp . All Rights Reserved.">
  <meta charset="utf-8">
  <title> Color Component </title>
<link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container">
    <div id="controlPanel" style="display:flex">
      <div>
	Color Filter:  <br />
        <select id="componentSelect" data-bind="component" size="8">
          <option value="rgb" selected> RGB </option>
          <option value="rgba"        > RGBA (with alpha) </option>
	  <option value="cmyk"        > CMYK (naive) </option>
	  <option value="cmy"         > CMY (naive) </option>
	  <option value="ycbcr"       > YCbCr (JPEG) </option>
	  <option value="yiq"         > YIQ (NTSC) </option>
	  <option value="yuv_bt601"   > YUV (PAL) SDTV BT.601 </option>
	  <option value="yuv_bt709"   > YUV (PAL) HDTV BT.709 </option>
	  <option value="ydbdr"       > YDbDr (SECOM) </option>
	  <option value="hsv"         > HSV (HSB) </option>
	  <option value="hsl"         > HSL (HLS) </option>
	  <option value="xyb"         > Xyb (naive) </option>
        </select>
      </div>
      <div>
	maxWidthHeight:<input id="maxWidthHeightRange" data-bind="maxWidthHeight" type="range" min="16" max="2048" step="1" value="320">:<input type="text" id="maxWidthHeightText" data-bind="maxWidthHeight" size="5">
      </div>
    </div>
  </div>
  <div>
    <div style="float:left">
      srcCanvas <br />
      <canvas id="srcCanvas" class="borderGray" width=200 height=200> srcCanvas </canvas>
    </div>
    <div style="float:left">
      amp1:<input id="amp1Range" data-bind="amp1" type="range" min="0" max="2" step="0.1" value="1.0">:<input type="text" id="amp1Text" data-bind="amp1" size="4"> <br />
      <canvas id="dstCanvas1" class="borderRed" width=200 height=200> dstCanvas1 </canvas>
    </div>
    <div style="float:left">
      amp2:<input id="amp2Range" data-bind="amp2" type="range" min="0" max="2" step="0.1" value="1.0">:<input type="text" id="amp2Text" data-bind="amp2" size="4"> <br />
      <canvas id="dstCanvas2" class="borderGreen" width=200 height=200> dstCanvas2 </canvas>
    </div>
    <div style="float:left">
      amp3:<input id="amp3Range" data-bind="amp3" type="range" min="0" max="2" step="0.1" value="1.0">:<input type="text" id="amp3Text" data-bind="amp3" size="4"> <br />
      <canvas id="dstCanvas3" class="borderBlue" width=200 height=200> dstCanvas3 </canvas>
    </div>
    <div style="float:left">
      amp4:<input id="amp4Range" data-bind="amp4" type="range" min="0" max="2" step="0.1" value="1.0">:<input type="text" id="amp4Text" data-bind="amp4" size="4"> <br />
      <canvas id="dstCanvas4" class="borderBlack" width=200 height=200> dstCanvas4 </canvas>
    </div>
    <div style="float:left">
      dstCanvas <br />
      <canvas id="dstCanvas" class="borderGray" width=200 height=200> dstCanvas </canvas>
    </div>
  </div>
  <script type="text/javascript" src="lib/drop.js"> </script>
  <script type="text/javascript" src="lib/bind.js"> </script>
  <script type="text/javascript" src="lib/canvas.js"> </script>
  <script type="text/javascript" src="lib/color.js"> </script>
  <script type="text/javascript" src="colorcomponent.js"> </script>
</body>
</html>
