<!doctype html>
<html>
  <head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="copyright" content="Copyright &copy; 2021/10/09- yoya@awm.jp . All Rights Reserved.">
    <meta charset="utf-8">
    <title> Contrast </title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="soft.css">
    <script src="lib/page.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="controlPanel">
	<label class="param"><span class="name">maxWidthHeight</span><input id="maxWidthHeightRange" data-bind="maxWidthHeight" type="range" min="16" max="2048" step="1" value="640"><input type="text" id="maxWidthHeightText" data-bind="maxWidthHeight" size="5"></label>
        <label class="param"><span class="name">amount</span><input id="amountRange" data-bind="amount" type="range" min="0" max="2.0" step="0.1" value="1"><input type="text" id="amountText" data-bind="amount" size="4"></label>
	<label class="check"><input id="RCheckbox" data-bind="R" type="checkbox" checked> R</label>
	<label class="check"><input id="GCheckbox" data-bind="G" type="checkbox" checked> G</label>
	<label class="check"><input id="BCheckbox" data-bind="B" type="checkbox" checked> B</label>
      </div> <!-- controlPanel -->
      <canvas id="srcCanvas" class="borderRed" width=200 height=200> srcCanvas </canvas>
      <canvas id="dstCanvas" class="borderBlue" width=200 height=200> dstCanvas </canvas>
    </div>  <!-- container -->
    <script type="text/javascript" src="lib/drop.js"> </script>
    <script type="text/javascript" src="lib/bind.js"> </script>
    <script type="text/javascript" src="lib/canvas.js"> </script>
    <script type="text/javascript" src="contrast.js"> </script>
  </body>
</html>
