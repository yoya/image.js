<!doctype html>
<html>
  <head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="copyright" content="Copyright &copy; 2021/11/13- yoya@awm.jp . All Rights Reserved.">
    <meta charset="utf-8">
    <title> Orientation </title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="soft.css">
    <script src="lib/page.js"></script>
    <style>
      canvas { vertical-align: top; }
    </style>
  </head>
  <body>
    <div class="container" style="display:flex;">
      <div class="controlPanel">
        <div>
	  <label class="param"><span class="name">maxWidthHeight</span><input id="maxWidthHeightRange" data-bind="maxWidthHeight" type="range" min="16" max="2048" step="1" value="480"><input type="text" id="maxWidthHeightText" data-bind="maxWidthHeight" size="5"></label>
          <label class="check"><input id="guideCheckbox" data-bind="guide" type="checkbox" checked/> Guide</label>
        </div>
        <div>
          <select id="orientationSelect" data-bind="orientation" size="8">
            <option value="1" selected> 1 </option>
            <option value="2"> 2 - hori </option>
            <option value="3"> 3 - hori & vert </option>
            <option value="4"> 4 - vert </option>
            <option value="5"> 5 - diag </option>
            <option value="6"> 6 - hori & diag</option>
            <option value="7"> 7 - hori & vert & diag</option>
            <option value="8"> 8 - vert & diag</option>
          </select>
        </div>
        <div>
          <label class="check"><input id="horizontalCheckbox" data-bind="horizontal" type="checkbox" /> Horizontal</label>
          <label class="check"><input id="verticalCheckbox" data-bind="vertical" type="checkbox" /> Vertical</label>
          <br />
          <label class="check"><input id="diagonalCheckbox" data-bind="diagonal" type="checkbox" /> Diagonal</label>
        </div>
        <div>
          <button id="rotate270Button" data-bind="rotate270Button" type="button"> rotate 270 </button>
          <button id="rotate90Button" data-bind="rotate90Button" type="button"> rotate 90 </button>
          <br />
          <button id="horizontalButton" data-bind="horizontalButton" type="button"> horizontal </button>
          <button id="verticalButton" data-bind="verticalButton" type="button"> vertical </button>
        </div>
      </div> <!-- controlPanel -->
      <div>
        <caption> orientation image </caption> <br />
        <canvas id="dstCanvas" class="borderBlue" width=200 height=200> dstCanvas </canvas>
        </div>
      <div>
        <caption> reference image </caption> <br />
        <canvas id="srcCanvas" class="borderRed" width=200 height=200> srcCanvas </canvas>
        </div>
      <div>
        <caption> auto-orient </caption> <br />
        <canvas id="dstCanvas2" class="borderGreen" width=200 height=200> dstCanvas2 </canvas>
      </div>
    </div>  <!-- container -->
    <script type="text/javascript" src="lib/drop.js"> </script>
    <script type="text/javascript" src="lib/bind.js"> </script>
    <script type="text/javascript" src="lib/canvas.js"> </script>
    <script type="text/javascript" src="orientation.js"> </script>
  </body>
</html>
