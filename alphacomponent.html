<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="copyright" content="Copyright &copy; 2021/04/07- yoya@awm.jp . All Rights Reserved.">
  <meta charset="utf-8">
  <title> Alpha Component </title>
<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="soft.css">
<script src="lib/page.js"></script>
</head>
<body>
  <div class="container">
    <div id="controlPanel" style="display:flex">
      <div>
	<label class="param"><span class="name">maxWidthHeight</span><input id="maxWidthHeight" data-bind="maxWidthHeight" type="range" min="16" max="2048" step="1" value="320"><input type="text" id="maxWidthHeightText" data-bind="maxWidthHeight" size="5"></label>
      </div>
      <div>
        <input type="color" id="backgroundColor" data-bind="backgroundColor" value="#FFFFFF" />:<input type="text" id="backgroundColorText" data-bind="backgroundColor" size="9" value="#FFFFFF">
      </div>
      <div>
        <label class="check"><input type="checkbox" id="checkboard" data-bind="checkboard" checked/> checkboard</label>
      </div>
    </div>
  </div>
  <div>
    <div style="float:left">
      srcCanvas <br />
      <canvas id="srcCanvas" class="borderGray" width=200 height=200> srcCanvas </canvas>
    </div>
    <div style="float:left">
      rgbCanvas <br />
      <canvas id="dstCanvas0" class="borderWhite" width=200 height=200> dstCanvas0 </canvas>
    </div>
    <div style="float:left">
      <label class="param"><span class="name">multi1</span><input id="multi1" data-bind="multi1" type="range" min="0" max="2" step="0.1" value="1.0"><input type="text" id="multi1Text" data-bind="multi1" size="4"></label>
      <label class="param"><span class="name">plus1</span><input id="plus1" data-bind="plus1" type="range" min="-1" max="1" step="0.1" value="0.0"><input type="text" id="plus1Text" data-bind="plus1" size="4"></label>
      <canvas id="dstCanvas1" class="borderRed" width=200 height=200> dstCanvas1 </canvas>
    </div>
    <div style="float:left">
      <label class="param"><span class="name">multi2</span><input id="multi2" data-bind="multi2" type="range" min="0" max="2" step="0.1" value="1.0"><input type="text" id="multi2Text" data-bind="multi2" size="4"></label>
      <label class="param"><span class="name">plus2</span><input id="plus2" data-bind="plus2" type="range" min="-1" max="1" step="0.1" value="0.0"><input type="text" id="plus2Text" data-bind="plus2" size="4"></label>
      <canvas id="dstCanvas2" class="borderGreen" width=200 height=200> dstCanvas2 </canvas>
    </div>
    <div style="float:left">
      <label class="param"><span class="name">multi3</span><input id="multi3" data-bind="multi3" type="range" min="0" max="2" step="0.1" value="1.0"><input type="text" id="multi3Text" data-bind="multi3" size="4"></label>
      <label class="param"><span class="name">plus3</span><input id="plus3" data-bind="plus3" type="range" min="-1" max="1" step="0.1" value="0.0"><input type="text" id="plus3Text" data-bind="plus3" size="4"></label>
      <canvas id="dstCanvas3" class="borderBlue" width=200 height=200> dstCanvas3 </canvas>
    </div>
    <div style="float:left">
      <label class="param"><span class="name">multi4</span><input id="multi4" data-bind="multi4" type="range" min="0" max="2" step="0.1" value="1.0"><input type="text" id="multi4Text" data-bind="multi4" size="4"></label>
      <label class="param"><span class="name">plus4</span><input id="plus4" data-bind="plus4" type="range" min="-1" max="1" step="0.1" value="0.0"><input type="text" id="plus4Text" data-bind="plus4" size="4"></label>
      <canvas id="dstCanvas4" class="borderBlack" width=200 height=200> dstCanvas4 </canvas>
    </div>
    <div style="float:left">
      dstCanvas <br />
      <canvas id="dstCanvas" class="borderGray" width=200 height=200> dstCanvas </canvas>
    </div>
  </div>
  <script type="text/javascript" src="lib/drop.js"> </script>
  <script type="text/javascript" src="lib/bind.js"> </script>
  <script type="text/javascript" src="lib/image.js"> </script>
  <script type="text/javascript" src="lib/canvas.js"> </script>
  <script type="text/javascript" src="lib/color.js"> </script>
  <script type="text/javascript" src="alphacomponent.js"> </script>
</body>
</html>
