<!doctype html>
<html>
  <head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="copyright" content="Copyright &copy; 2017/06/22- yoya@awm.jp . All Rights Reserved.">
    <meta charset="utf-8">
    <title> Mosaic </title>
    <link rel="stylesheet" href="index.css">
    <script src="lib/page.js"></script>
  </head>
  <body>
    <div class="container">
     <div class="controlPanel">
	<label class="param"><span class="name">maxWidthHeight</span><input id="maxWidthHeightRange" data-bind="maxWidthHeight" type="range" min="16" max="2048" step="1" value="480"><input type="text" id="maxWidthHeightText" data-bind="maxWidthHeight" size="5"></label>
	<label class="param"><span class="name">block</span><input id="blockSizeRange" data-bind="blockSize" type="range" min="1" max="128" step="1" value="16"><input type="text" id="blockSizeText" data-bind="blockSize" size="4"></label>
	<div style="float:left">
          block type:  <br />
	  <select id="blockTypeSelect" data-bind="blockType" size="2">
            <option value="square" selected> 正方形 </option>
            <option value="hexagon"        > 六角形 </option>
          </select>
	</div>
      </div> <!-- controlPanel -->
      <canvas id="srcCanvas" class="borderRed" width=200 height=200> srcCanvas </canvas>
      <canvas id="dstCanvas" class="borderBlue" width=200 height=200> dstCanvas </canvas>
    </div>  <!-- container -->
    <script type="text/javascript" src="lib/drop.js"> </script>
    <script type="text/javascript" src="lib/bind.js"> </script>
    <script type="text/javascript" src="lib/canvas.js"> </script>
    <script type="text/javascript" src="lib/loading.js"> </script>
    <script type="text/javascript" src="lib/worker.js"> </script>
    <script type="text/javascript" src="mosaic.js"> </script>
  </body>
</html>
