<!doctype html>
<html>
  <head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="copyright" content="Copyright &copy; 2019/05/16- yoya@awm.jp . All Rights Reserved.">
    <meta charset="utf-8">
    <title> Pascal's Triangle </title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="soft.css">
    <script src="lib/page.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="controlPanel">
	<label class="param"><span class="name">width</span><input id="widthRange" data-bind="width" type="range" min="16" max="2048" step="1" value="640"><input type="text" id="widthText" data-bind="width" size="5"></label>
	<label class="param"><span class="name">height</span><input id="heightRange" data-bind="height" type="range" min="16" max="2048" step="1" value="320"><input type="text" id="heightText" data-bind="height" size="5"></label>
        <label class="param"><span class="name">nPascal</span><input id="nPascalRange" data-bind="nPascal" type="range" min="1" max="100" step="1" value="3"><input type="text" id="nPascalText" data-bind="nPascal" size="3"></label>
        <label class="param"><span class="name">nColor</span><input id="nColorRange" data-bind="nColor" type="range" min="1" max="100" step="1" value="5"><input type="text" id="nColorText" data-bind="nColor" size="5"></label>
        <label class="check"><input id="bottomBarCheckbox" data-bind="bottomBar" type="checkbox" checked /> bottomBar</label>
      </div> <!-- controlPanel -->
      <canvas id="dstCanvas" width=200 height=200> dstCanvas </canvas>
    </div>  <!-- container -->
    <script type="text/javascript" src="lib/bind.js"> </script>
    <script type="text/javascript" src="lib/canvas.js"> </script>
    <script type="text/javascript" src="lib/math.js"> </script>
    <script type="text/javascript" src="pascal.js"> </script>
  </body>
</html>
