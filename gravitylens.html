<!doctype html>
<html>
  <head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="copyright" content="Copyright &copy; 2024/02/04- yoya@awm.jp . All Rights Reserved.">
    <meta charset="utf-8">
    <title> copy </title>
    <link rel="stylesheet" href="index.css">
    <script src="lib/page.js"></script>
  </head>
  <body>
    <div id="container" class="vertical">
      <div id="control" class="horizontal">
        <div>
	  maxWidthHeight:<input id="maxWidthHeight" data-bind="maxWidthHeight" type="range" min="16" max="2048" step="1" value="640">:<input type="text" id="maxWidthHeightText" data-bind="maxWidthHeight" size="5">
        </div>
        <div>
	  amount:<input id="amount" data-bind="amount" type="range" min="-1024" max="1024" step="1" value="-512">:<input type="text" id="amountText" data-bind="amount" size="5">
        </div>
        <div>
	  scale:<input id="scale" data-bind="scale" type="range" min="0.01" max="1" step="0.01" value="0.05">:<input type="text" id="scaleText" data-bind="scale" size="5">
        </div>
      </div> <!-- control -->
      <div id="display" class="horizontal">
        <canvas id="srcCanvas" class="borderRed" width=200 height=200> srcCanvas </canvas>
        <canvas id="dstCanvas" class="borderBlue" width=200 height=200> dstCanvas </canvas>
      </div>  <!-- display -->
    </div>  <!-- container -->
    <small> (c) <a href="https://twitter.com/PeRossello/status/1753016577824280621"> https://twitter.com/PeRossello/status/1753016577824280621 </a> </small>
    <script type="text/javascript" src="lib/drop.js"> </script>
    <script type="text/javascript" src="lib/bind.js"> </script>
    <script type="text/javascript" src="lib/canvas.js"> </script>
    <script type="text/javascript" src="gravitylens.js"> </script>
  </body>
</html>
